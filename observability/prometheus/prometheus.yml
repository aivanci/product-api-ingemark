global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'product-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # host.docker.internal is Docker Desktop's DNS name for the host machine (Mac/Windows).
      # The app runs on the host via `./mvnw spring-boot:run`, not inside this compose network.
      - targets: ['host.docker.internal:8080']