spring:
  application:
    name: product-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  hnb:
    # HNB Exchange Rate List API (base currency EUR since 1.1.2023)
    # TBD

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    hr.ingemark.assignment.productapi: DEBUG
